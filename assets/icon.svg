<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">DocWen</title>
  <desc id="description">Two document pages with opposing conversion arrows and a geometrically exact sixty-degree folded corner.</desc>

