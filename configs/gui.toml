# ==============================================================================
#  DocWen GUI 配置
#  面板尺寸、窗口布局、主题、字体、通知、透明度、模板、语言
# ==============================================================================

[window]
# 面板尺寸配置
# 单位: 像素（逻辑值，会根据DPI自动缩放）
center_panel_width = 460        # 中栏宽度（文件拖拽区和操作面板）
left_panel_width = 400          # 批量面板宽度（批量模式下的文件列表）
right_panel_width = 300         # 模板面板宽度（模板选择器）

# 窗口几何持久化配置（逻辑值，供下次启动恢复使用）
# 仓库默认值保持与 docwen_gui.window_geometry 的声明常量一致；运行后会按本机保存值覆盖
geometry_schema_version = 2     # 当前 normal-geometry schema 版本（仅支持 v2）
center_panel_screen_x = 420      # 仓库稳定默认的中栏锚点X坐标（运行后会被本机保存值覆盖）
window_y = 0                       # 仓库稳定默认的窗口左上角Y坐标
default_mode = "single"         # 默认启动模式："single"（单文件）或"batch"（批量）

# 窗口尺寸设置
default_width = 476              # normal client 宽度：8px + 460px 中栏 + 8px
default_height = 860             # 仓库稳定默认的窗口高度；无保存值时作为启动默认高度
min_width = 420                  # 最小窗口宽度；小工作区会按可用宽度临时夹紧
min_height = 720                # 最小窗口高度

# 窗口行为/布局策略
auto_center = false             # 是否自动居中窗口
remember_gui_state = true       # 是否记住 normal geometry（中栏锚点、Y、宽度和高度）
expand_side_panels = false      # 窗口变宽时左右栏是否参与扩展（默认仅中栏扩展）

[dpi]
# UI DPI缩放设置
# enable_dpi_scaling = false 会禁用DPI缩放（强制按原始设计尺寸渲染UI）
# ui_scale = 0 表示自动检测；非0可写缩放系数（如 1.25 / 1.5 / 2.0）或百分比（如 125 / 150 / 200 / "150%"）
enable_dpi_scaling = true
ui_scale = 0

[component]
file_drop_height = 230   # 文件拖拽区域高度

[theme]
# 主题设置
default_theme = "light"  # 默认项目主题语义值（light / dark / system）

[font]
# 字号预设
# 可选值：
#   "small" - 小
#   "default" - 默认
#   "large" - 大
#   "xlarge" - 特大
size_preset = "default"

[history]
# 最近使用历史
recent_files = []
recent_templates = []
max_recent = 10
last_document_format = "docx"   # MD→文档 上次使用的格式：docx / doc / odt / rtf
last_spreadsheet_format = "xlsx" # MD→表格 上次使用的格式：xlsx / xls / ods / csv

[notifications]
# 任务完成提醒
task_completion = true
min_elapsed_seconds = 8
system_tray = false
system_tray_timeout_ms = 6000

[transparency]
# 透明度设置
enabled = false   # 是否启用窗口透明度效果
default_value = 0.95   # 默认透明度值 (0.0完全透明 - 1.0完全不透明)
min_value = 0.8        # 最小透明度限制
max_value = 1.0        # 最大透明度限制

[template]
# MD文件默认模板类型
# 可选值：
#   "docx" - 使用文档模板
#   "xlsx" - 使用表格模板
md_default_template = "docx"

[language]
# 界面语言设置
# 可选值：
#   "zh_CN" - 简体中文
#   "en_US" - English (US)
locale = "zh_CN"
