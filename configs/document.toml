# ==============================================================================
#  DocWen 文档配置
#  默认值(defaults.document) + 样式(style)
# ==============================================================================

# ── 转MD时的默认设置 ──
# 默认勾选"提取图片"（在MD中包含图片信息，无论采用文件方式还是Base64内联方式）
to_md_keep_images = true
# 默认不勾选"图片文字识别"
to_md_enable_ocr = false
# 提取方式: file(图片文件) / base64(Base64编码)
# OCR位置迁移回退：仅当全局 export 同名键缺失/留空时供 GUI 使用；生产默认见 export.toml
# 合并单元格导出策略: empty(保留空位) / fill(展开后填充值)
to_md_table_merge_export_strategy = "empty"
# 默认清除文档中的原序号
to_md_remove_numbering = true
# 默认不添加新序号到Markdown
to_md_add_numbering = false
# 默认使用的序号方案
to_md_default_scheme = "hierarchical_standard"
# 默认启用针对文档类型优化
to_md_enable_optimization = false
# 默认优化类型ID
to_md_optimization_type = "gongwen"

# ── 代码样式配置 ──
# 样式名数据源说明：
# - 我们定义的样式名（如"代码块"/"Code Block"）存储在语言文件中
# - 本文件只存储第三方软件（Word/WPS）内置的样式名别名，用于检测

# DOCX → MD 代码识别
[style.code.docx_to_md]
# 第三方段落样式别名（仅用于检测，不用于注入）
# 整段为代码时转为代码块
paragraph_style_aliases = ["HTML Preformatted"]

# 第三方字符样式别名（仅用于检测，不用于注入）
# 部分文本为代码时转为行内代码
character_style_aliases = ["HTML Code", "HTML Typewriter", "HTML Keyboard", "HTML Sample", "HTML Variable", "HTML Definition", "HTML Cite", "HTML Address", "HTML Acronym", "Code", "Source Code", "源代码", "源码"]

# 整段检测：如果段落中所有run都是字符级代码样式，则视为代码块
# 否则按行内代码处理
full_paragraph_as_block = true

# 模糊匹配开关
fuzzy_match_enabled = true

# 模糊匹配关键词（不区分大小写）
fuzzy_keywords = ["code", "代码", "源码"]

# 底纹识别配置（仅 DOCX → MD 方向使用）
# WPS 和 Word 的字符底纹实现方式不同：
# - WPS：纯色填充（w:val="clear" + w:fill="D9D9D9"），颜色硬编码在代码中
# - Word：图案填充（w:val="pct15" + w:fill="FFFFFF"），图案类型硬编码在代码中
[style.code.docx_to_md.shading]
# WPS 字符底纹识别
wps_enabled = true

# Word 字符底纹识别
word_enabled = true

# MD → DOCX 代码输出
# 样式键名对应语言文件中的 [styles] 节
[style.code.md_to_docx]
# 行内代码 `code` 使用的样式键名
inline_code_style_key = "inline_code"

# 代码块 ```code``` 使用的样式键名
code_block_style_key = "code_block"

# ── 引用样式配置 ──
# 定义引用样式的识别规则和输出样式
# 支持分级引用：引用 1~9 对应 Markdown 的 > >> >>> ...
#
# 样式名数据源说明：
# - 我们定义的样式名（如"引用 1"/"Quote 1"）存储在语言文件中
# - 本文件只存储第三方软件（Word/WPS）内置的样式名别名，用于检测

# DOCX → MD 引用识别
[style.quote.docx_to_md]
# 第三方分级样式别名映射（仅用于检测）
# 格式: { "第三方样式名" = 级别 }
# 用于识别 Word/WPS 内置样式的引用级别
level_style_aliases = {}

# 第三方通用引用样式别名（仅用于检测，无法确定级别时默认为1级）
paragraph_style_aliases = ["Quote", "Block Text", "Intense Quote", "引用", "明显引用"]

# 第三方字符样式别名（仅用于检测）
character_style_aliases = ["Quote Char", "引用字符"]

# 整段检测：如果段落中所有run都是字符级引用样式，则视为引用块
# 否则按行内代码处理
full_paragraph_as_block = true

# 模糊匹配开关
fuzzy_match_enabled = true

# 模糊匹配关键词（不区分大小写）
fuzzy_keywords = ["quote", "引用"]

# MD → DOCX 引用输出
# 将 Markdown 引用转换为分级引用样式
# > 对应 quote_1, >> 对应 quote_2, 以此类推（最高支持9级）
# 样式键名对应语言文件中的 [styles] 节
[style.quote.md_to_docx]
# 分级引用样式键名映射
# Markdown > 数量对应的样式键名
level_1_style_key = "quote_1"
level_2_style_key = "quote_2"
level_3_style_key = "quote_3"
level_4_style_key = "quote_4"
level_5_style_key = "quote_5"
level_6_style_key = "quote_6"
level_7_style_key = "quote_7"
level_8_style_key = "quote_8"
level_9_style_key = "quote_9"

# ── 公式样式配置 ──
# 定义公式样式的输出样式
#
# 样式名数据源说明：
# - 我们定义的样式名（如"公式块"/"Formula Block"）存储在语言文件中
# - 本文件只存储样式键名引用和功能配置

# MD → DOCX 公式输出
# 样式键名对应语言文件中的 [styles] 节
[style.formula.md_to_docx]
# 行内公式 $...$ 使用的样式键名（字符样式）
inline_formula_style_key = "inline_formula"

# 公式块 $$...$$ 使用的样式键名（段落样式）
formula_block_style_key = "formula_block"

# ── 表格样式配置 ──
# 定义表格样式的输出样式
#
# 样式名数据源说明：
# - 我们定义的样式名（如"三线表"/"Three Line Table"）存储在语言文件中
# - 本文件只存储样式键名引用和功能配置

# DOCX → MD 表格样式识别
[style.table.docx_to_md]
# 第三方表格样式别名（仅用于检测，不用于注入）
# 用于识别"网格表/三线表"等表格样式（如 Word/WPS 内置名称或其它模板命名）
three_line_table_style_aliases = ["Three Line Table", "三线表"]

table_grid_style_aliases = ["Table Grid", "网格表", "网格型"]

# 第三方单元格内容段落样式别名（仅用于检测，不用于注入）
table_content_paragraph_style_aliases = ["Table Content", "表格内容"]

# MD → DOCX 表格输出
# 样式键名对应语言文件中的 [styles] 节
[style.table.md_to_docx]
# 表格样式模式: "builtin" 使用内置样式, "custom" 使用自定义样式名
table_style_mode = "builtin"

# 内置样式键名: "three_line_table" (三线表) 或 "table_grid" (网格表)
# 内置样式会自动检测模板是否存在，不存在则注入
builtin_style_key = "three_line_table"

# 自定义样式名称（当 table_style_mode = "custom" 时使用）
# 如果模板中不存在此样式，会创建一个网格表格式的同名样式
custom_style_name = ""
