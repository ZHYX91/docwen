# ==============================================================================
#  DocWen 公文字段处理器配置
# ==============================================================================

[settings]
order = ["gongwen"]

[processors.gongwen]
module = "docwen_plugin_markdown.field_processors.gongwen"
name = "公文字段优化"
description = "附件说明悬挂缩进、抄送机关拼接、印发日期/成文日期格式化、附注去括号等"
locales = ["zh_CN"]
enabled = true
is_system = true
