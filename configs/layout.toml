# ==============================================================================
#  DocWen 版式文件默认配置
# ==============================================================================

# 转MD时的默认设置
# 默认勾选"提取图片"（在MD中包含图片信息，无论采用文件方式还是Base64内联方式）
to_md_keep_images = true
# 默认勾选"图片文字识别"
to_md_enable_ocr = false
# 提取方式: file(图片文件) / base64(Base64编码)
# OCR位置迁移回退：仅当全局 export 同名键缺失/留空时供 GUI 使用；生产默认见 export.toml
# 默认内容优化：none（不预选）或运行时提供的优化资源 ID（如 invoice_cn）
to_md_optimization = "none"

# 渲染选项默认设置
# 渲染DPI: 150/300/600
render_dpi = 300

# Operation defaults; actual targets still require an available conversion route.
split_mode = "every_page"
document_format = "DOCX"
render_format = "TIF"
