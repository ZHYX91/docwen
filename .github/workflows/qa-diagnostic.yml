name: qa diagnostic

on:
  push:
    branches:
      - fix/portable-data-and-integration-contracts

permissions:
  contents: write

jobs:
  source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/portable-data-and-integration-contracts
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --extra lint --extra test
      - name: Capture source QA
        shell: bash
        run: |
          set +e
          uv run python tools/qa.py --skip-pytest > qa-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> qa-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-diagnostic.txt
          git commit -m "chore: capture source QA diagnostic"
          git push origin HEAD:fix/portable-data-and-integration-contracts
          exit 0
