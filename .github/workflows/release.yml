name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable x.y.z source version
        required: true
        type: string
      operation:
        description: Build a verified candidate, or publish the supplied artifact
        required: true
        type: choice
        options: [preflight, publish, verify]
        default: preflight
      artifact_id:
        description: Exact preflight publication artifact ID (publish only)
        type: string
      artifact_digest:
        description: Exact sha256 digest of that artifact archive (publish only)
        type: string
      resume_artifact_id:
        description: Exact saved publication-progress artifact ID when resuming
        type: string
      resume_artifact_digest:
        description: Exact sha256 digest of the saved progress archive
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PUBLICATION_ARTIFACT_NAME: docwen-publication-${{ github.run_id }}-${{ github.run_attempt }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  source-checks:
    if: inputs.operation == 'preflight'
    uses: ./.github/workflows/tests.yml

  release-gate:
    needs: source-checks
    name: Source gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    env:
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Verify numeric version and source identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_VERSION" = "$source_version"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "preflight requires an unused numeric tag" >&2
            exit 2
          fi
      - name: Install exact lockfile
        run: uv sync --frozen --extra test --extra lint
      - name: Run release source gate
        env:
          DOCWEN_PYTEST_RUNTIME_ROOT: ${{ runner.temp }}/docwen-pytest-runtime
        run: uv run python tools/qa.py --skip-ruff --skip-pyright --suite release

  build-windows:
    name: Clean Windows build ${{ matrix.replica }}
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Prime the exact offline dependency cache
        run: uv sync --frozen --extra dev
      - name: Build the authoritative manifest-bound candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = uv run python -c "import sys; print(sys.executable)"
          $uv = (Get-Command uv).Source
          $output = Join-Path $env:RUNNER_TEMP "docwen-candidate"
          $work = Join-Path $env:RUNNER_TEMP "docwen-build-work"
          $buildArguments = @(
            "scripts/release/build_production_candidate.py",
            "--repo", (Resolve-Path ".").Path,
            "--manifest", (Resolve-Path "release/windows-production-manifest.v1.json").Path,
            "--python", $python,
            "--uv", $uv,
            "--output-root", $output,
            "--work-root", $work
          )
          & $python @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          uv run python scripts/release/verify_packaged_cli.py --binary-dir "$output/payload" --proofread-report-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/release/verify_packaged_gui.py --binary-dir "$output/payload" --settings-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msixArguments = @(
            "scripts/release/build_msix.py",
            "--payload-root", "$output/payload",
            "--config", (Resolve-Path "release/windows-store-msix.v1.json").Path,
            "--source-version", $env:RELEASE_VERSION,
            "--output-root", $output,
            "--work-root", (Join-Path $env:RUNNER_TEMP "docwen-msix-work"),
            "--metadata-output", "$output/DocWen-windows-x64.msix.json"
          )
          & $python @msixArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload clean Windows build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/docwen-candidate/DocWen-windows-x64.zip
            ${{ runner.temp }}/docwen-candidate/DocWen-windows-x64.msix
            ${{ runner.temp }}/docwen-candidate/DocWen-windows-x64.msix.json
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  build-linux:
    name: Clean Ubuntu build ${{ matrix.replica }}
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install Linux GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install exact lockfile
        run: uv sync --frozen --extra dev
      - name: Build GUI and CLI payloads
        run: xvfb-run -a uv run python scripts/build/build.py --skip-cython --version "$RELEASE_VERSION"
      - name: Create deterministic Linux archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir publication
          uv run python scripts/release/linux_archive.py \
            --contract release/linux-production-manifest.v1.json \
            --artifact cli-only \
            --payload-root "dist/DocWenCLI_v${RELEASE_VERSION}_linux-x64" \
            --output "publication/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz"
          uv run python scripts/release/linux_archive.py \
            --contract release/linux-production-manifest.v1.json \
            --artifact gui-cli \
            --payload-root "dist/DocWen_v${RELEASE_VERSION}_linux-x64" \
            --output "publication/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz"
      - name: Verify extracted Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted-cli extracted-gui
          tar -xzf "publication/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" -C extracted-cli --no-same-owner
          tar -xzf "publication/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" -C extracted-gui --no-same-owner
          cli_dir="extracted-cli/DocWenCLI-${RELEASE_VERSION}-linux-x64"
          gui_dir="extracted-gui/DocWen-${RELEASE_VERSION}-linux-x64"
          (cd "$cli_dir" && sha256sum --check SHA256SUMS.txt)
          (cd "$gui_dir" && sha256sum --check SHA256SUMS.txt)
          uv run python scripts/release/verify_packaged_cli.py --binary-dir "$cli_dir" --proofread-report-smoke
          xvfb-run -a uv run python scripts/release/verify_packaged_gui.py --binary-dir "$gui_dir" --settings-smoke
      - name: Upload clean Ubuntu build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: publication/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  verify-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Windows build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}-a
          path: builds/windows-a
      - name: Download Windows build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}-b
          path: builds/windows-b
      - name: Download Ubuntu build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}-a
          path: builds/linux-a
      - name: Download Ubuntu build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}-b
          path: builds/linux-b
      - name: Compare independent builds and assemble exact candidate
        run: >-
          python scripts/release/publication.py assemble
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --source . --builds builds --directory publication
      - name: Attest exact candidate and public assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: publication/*
      - name: Upload Microsoft Store submission package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-microsoft-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            builds/windows-a/DocWen-windows-x64.msix
            builds/windows-a/DocWen-windows-x64.msix.json
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Upload the exact preflight publication artifact
        id: publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PUBLICATION_ARTIFACT_NAME }}
          path: publication/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Record candidate identity
        env:
          ARTIFACT_ID: ${{ steps.publication.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publication.outputs.artifact-digest }}
        run: |
          echo "Candidate artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate artifact digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "No tag or Release was created by this preflight." >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
      RESUME_ARTIFACT_DIGEST: ${{ inputs.resume_artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve the verified preflight artifact
        run: >-
          python scripts/release/publication.py fetch
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
          --directory "$RUNNER_TEMP/publication"
      - name: Verify draft assets, publish and read back
        env:
          DOCWEN_IMMUTABILITY_READ_TOKEN: ${{ secrets.DOCWEN_IMMUTABILITY_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCWEN_IMMUTABILITY_READ_TOKEN"
          resume_args=()
          if [[ -n "$RESUME_ARTIFACT_ID" ]]; then
            test -n "$RESUME_ARTIFACT_DIGEST"
            resume_args=(--resume-artifact-id "$RESUME_ARTIFACT_ID" --resume-artifact-digest "$RESUME_ARTIFACT_DIGEST")
          else
            test -z "$RESUME_ARTIFACT_DIGEST"
            test "$GITHUB_RUN_ATTEMPT" -eq 1
          fi
          python scripts/release/publication.py publish \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --directory "$RUNNER_TEMP/publication" --receipt "$RUNNER_TEMP/publication-progress.json" \
            --notes docs/CHANGELOG.md "${resume_args[@]}"
      - name: Preserve publication progress, including uncertain writes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-publication-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-progress.json
          if-no-files-found: warn
          retention-days: 30

  post-verify:
    if: always() && (inputs.operation == 'publish' || inputs.operation == 'verify')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve the same verified candidate
        run: >-
          python scripts/release/publication.py fetch
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
          --directory "$RUNNER_TEMP/publication"
      - name: Independently verify immutable hosted bytes and provenance
        run: >-
          python scripts/release/publication.py verify
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
          --directory "$RUNNER_TEMP/publication" --receipt "$RUNNER_TEMP/publication-readback.json"
      - name: Save independent readback receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-publication-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-readback.json
          if-no-files-found: warn
          retention-days: 30
