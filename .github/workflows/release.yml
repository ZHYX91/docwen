name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable x.y.z version to preflight before creating its tag
        required: true
        type: string
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  PUBLICATION_ARTIFACT_NAME: docwen-publication-${{ github.run_id }}-${{ github.run_attempt }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-gate:
    name: Source gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    env:
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Verify numeric version and source identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_VERSION" = "$source_version"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_SHA" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
              echo "preflight requires an unused numeric tag" >&2
              exit 2
            fi
          else
            test "$GITHUB_REF" = "refs/tags/$RELEASE_VERSION"
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          fi
      - name: Install exact lockfile
        run: uv sync --frozen --extra test
      - name: Run release source gate
        env:
          DOCWEN_PYTEST_RUNTIME_ROOT: ${{ runner.temp }}/docwen-pytest-runtime
        run: uv run python tools/qa.py --skip-ruff --skip-pyright --suite release

  build-windows:
    name: Clean Windows build ${{ matrix.replica }}
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Prime the exact offline dependency cache
        run: uv sync --frozen --extra dev
      - name: Build the authoritative manifest-bound candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = uv run python -c "import sys; print(sys.executable)"
          $uv = (Get-Command uv).Source
          $output = Join-Path $env:RUNNER_TEMP "docwen-candidate"
          $work = Join-Path $env:RUNNER_TEMP "docwen-build-work"
          $buildArguments = @(
            "scripts/release/build_production_candidate.py",
            "--repo", (Resolve-Path ".").Path,
            "--manifest", (Resolve-Path "release/windows-production-manifest.v1.json").Path,
            "--python", $python,
            "--uv", $uv,
            "--output-root", $output,
            "--work-root", $work
          )
          & $python @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          uv run python scripts/release/verify_packaged_cli.py --binary-dir "$output/payload" --proofread-report-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/release/verify_packaged_gui.py --binary-dir "$output/payload" --settings-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload clean Windows build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: ${{ runner.temp }}/docwen-candidate/DocWen-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  build-linux:
    name: Clean Ubuntu build ${{ matrix.replica }}
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install Linux GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install exact lockfile
        run: uv sync --frozen --extra dev
      - name: Build GUI and CLI payloads
        run: xvfb-run -a uv run python scripts/build/build.py --skip-cython --version "$RELEASE_VERSION"
      - name: Create deterministic Linux archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir publication
          uv run python scripts/release/linux_archive.py \
            --contract release/linux-production-manifest.v1.json \
            --artifact cli-only \
            --payload-root "dist/DocWenCLI_v${RELEASE_VERSION}_linux-x64" \
            --output "publication/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz"
          uv run python scripts/release/linux_archive.py \
            --contract release/linux-production-manifest.v1.json \
            --artifact gui-cli \
            --payload-root "dist/DocWen_v${RELEASE_VERSION}_linux-x64" \
            --output "publication/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz"
      - name: Verify extracted Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted-cli extracted-gui
          tar -xzf "publication/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" -C extracted-cli --no-same-owner
          tar -xzf "publication/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" -C extracted-gui --no-same-owner
          cli_dir="extracted-cli/DocWenCLI-${RELEASE_VERSION}-linux-x64"
          gui_dir="extracted-gui/DocWen-${RELEASE_VERSION}-linux-x64"
          (cd "$cli_dir" && sha256sum --check SHA256SUMS.txt)
          (cd "$gui_dir" && sha256sum --check SHA256SUMS.txt)
          uv run python scripts/release/verify_packaged_cli.py --binary-dir "$cli_dir" --proofread-report-smoke
          xvfb-run -a uv run python scripts/release/verify_packaged_gui.py --binary-dir "$gui_dir" --settings-smoke
      - name: Upload clean Ubuntu build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: publication/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  verify-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.publication.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication.outputs.artifact-digest }}
      artifact_name: ${{ env.PUBLICATION_ARTIFACT_NAME }}
    steps:
      - name: Download Windows build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}-a
          path: builds/windows-a
      - name: Download Windows build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}-b
          path: builds/windows-b
      - name: Download Ubuntu build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}-a
          path: builds/linux-a
      - name: Download Ubuntu build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}-b
          path: builds/linux-b
      - name: Compare independent builds and assemble exact assets
        shell: bash
        run: |
          set -euo pipefail
          cmp builds/windows-a/DocWen-windows-x64.zip builds/windows-b/DocWen-windows-x64.zip
          cmp "builds/linux-a/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" "builds/linux-b/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz"
          cmp "builds/linux-a/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" "builds/linux-b/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz"
          mkdir publication
          cp builds/windows-a/DocWen-windows-x64.zip publication/
          cp "builds/linux-a/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" publication/
          cp "builds/linux-a/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" publication/
          (
            cd publication
            sha256sum DocWen-windows-x64.zip "DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" "DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" > SHA256SUMS.txt
            test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          )
      - name: Upload the sole current-run publication artifact
        if: github.event_name == 'push'
        id: publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PUBLICATION_ARTIFACT_NAME }}
          path: publication/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 1
      - name: Preflight completed without publishing
        if: github.event_name == 'workflow_dispatch'
        run: echo "Release preflight passed for ${RELEASE_VERSION}; no tag or Release was created."

  publish:
    if: github.event_name == 'push'
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download the exact current-run publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify-release.outputs.artifact_id }}
          path: publication
      - name: Verify the fixed publication inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' "DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" "DocWen-windows-x64.zip" "DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" "SHA256SUMS.txt")"
          observed="$(find publication -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          (cd publication && sha256sum --check SHA256SUMS.txt)
      - name: Fail closed or select an exact immutable no-op
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_status="$(curl --silent --show-error --location --output /tmp/release.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION")"
          case "$release_status" in
            200)
              jq --exit-status --arg version "$RELEASE_VERSION" \
                '.tag_name == $version and .draft == false and .prerelease == false and .immutable == true and ((.published_at | type) == "string") and ((.published_at | length) > 0)' \
                /tmp/release.json >/dev/null
              mkdir existing
              gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir existing
              expected="$(find publication -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
              observed="$(find existing -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
              test "$observed" = "$expected"
              for asset in publication/*; do
                cmp "$asset" "existing/$(basename "$asset")"
                gh attestation verify "existing/$(basename "$asset")" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
              done
              echo "decision=noop" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "decision=create" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "GitHub Release lookup failed with HTTP $release_status" >&2
              exit 1
              ;;
          esac
      - name: Attest exact assets
        if: steps.release_state.outputs.decision == 'create'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: publication/*
      - name: Create the immutable Release
        if: steps.release_state.outputs.decision == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_release_tag() {
            local direct="" peeled="" sha ref
            while read -r sha ref; do
              case "$ref" in
                "refs/tags/$RELEASE_VERSION") direct="$sha" ;;
                "refs/tags/$RELEASE_VERSION^{}") peeled="$sha" ;;
                *) return 1 ;;
              esac
            done < <(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}")
            test -n "$direct"
            test "${peeled:-$direct}" = "$GITHUB_SHA"
          }
          verify_release_tag
          gh release create "$RELEASE_VERSION" publication/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_VERSION" --generate-notes
          verify_release_tag
      - name: Final immutable Release and byte readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            release_status="$(curl --silent --show-error --location --output /tmp/final.json --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION")"
            if [[ "$release_status" == "200" ]] && jq --exit-status --arg version "$RELEASE_VERSION" \
              '.tag_name == $version and .draft == false and .prerelease == false and .immutable == true and ((.published_at | type) == "string") and ((.published_at | length) > 0)' \
              /tmp/final.json >/dev/null; then
              break
            fi
            test "$attempt" -lt 10
            sleep 3
          done
          mkdir readback
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir readback
          for asset in publication/*; do
            name="$(basename "$asset")"
            cmp "$asset" "readback/$name"
            gh attestation verify "readback/$name" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          verify_release_tag() {
            local direct="" peeled="" sha ref
            while read -r sha ref; do
              case "$ref" in
                "refs/tags/$RELEASE_VERSION") direct="$sha" ;;
                "refs/tags/$RELEASE_VERSION^{}") peeled="$sha" ;;
                *) return 1 ;;
              esac
            done < <(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}")
            test -n "$direct"
            test "${peeled:-$direct}" = "$GITHUB_SHA"
          }
          verify_release_tag
