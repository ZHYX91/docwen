name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      operation:
        description: Verify a candidate without publishing, or publish the selected candidate
        required: true
        type: choice
        options: [verify, publish]
        default: verify
      artifact_id:
        description: Exact candidate ID to publish or read back; omit to build once from the selected ref
        type: string
      resume_artifact_id:
        description: Saved progress artifact ID for an interrupted publication
        type: string
      macos_only:
        description: Verify only Mac packages after all source gates; no full candidate or publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  PUBLICATION_ARTIFACT_NAME: docwen-publication-${{ github.run_id }}-${{ github.run_attempt }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  identity:
    name: Source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build: ${{ steps.identity.outputs.build }}
      publish: ${{ steps.identity.outputs.publish }}
      verify_hosted: ${{ steps.identity.outputs.verify_hosted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
      - name: Resolve the selected source and operation
        id: identity
        env:
          OPERATION: ${{ inputs.operation || 'publish' }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RESUME_ID: ${{ inputs.resume_artifact_id }}
          MACOS_ONLY: ${{ inputs.macos_only && 'true' || 'false' }}
        run: >-
          uv run --no-project python scripts/release/publication_entry.py
          --source-ref "$GITHUB_REF" --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME"
          --operation "$OPERATION" --artifact-id "$ARTIFACT_ID" --resume-id "$RESUME_ID"
          --macos-only "$MACOS_ONLY"
          --github-output "$GITHUB_OUTPUT"

  source-checks:
    needs: identity
    if: needs.identity.outputs.build == 'true' && !inputs.macos_only
    uses: ./.github/workflows/tests.yml

  macos-source-checks:
    name: Mac package source checks
    needs: identity
    if: needs.identity.outputs.build == 'true' && inputs.macos_only
    runs-on: macos-15
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - run: brew install libheif
      - run: uv sync --frozen --extra dev --extra lint --extra test
      - name: Required source checks and native Mac platform selection
        run: >-
          uv run python tools/qa.py --suite platform
          --pytest-runtime-root "$RUNNER_TEMP/docwen-macos-qa" --own-pytest-runtime
          --report-output "$RUNNER_TEMP/docwen-macos-source-reports"
      - name: Save native source check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-macos-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docwen-macos-source-reports/
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    if: ${{ !inputs.macos_only }}
    name: Build Windows packages
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    needs: [identity, source-checks]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Prime the exact offline dependency cache
        run: uv sync --frozen --extra dev
      - name: Build the authoritative manifest-bound candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = uv run python -c "import sys; print(sys.executable)"
          $uv = (Get-Command uv).Source
          $output = Join-Path $env:RUNNER_TEMP "docwen-candidate"
          $work = Join-Path $env:RUNNER_TEMP "docwen-build-work"
          $buildArguments = @(
            "scripts/release/build_production_candidate.py",
            "--repo", (Resolve-Path ".").Path,
            "--manifest", (Resolve-Path "release/windows-production-manifest.v1.json").Path,
            "--python", $python,
            "--uv", $uv,
            "--output-root", $output,
            "--work-root", $work
          )
          & $python @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          uv run python scripts/release/verify_packaged_cli.py --binary-dir "$output/payload" --proofread-report-smoke --gongwen-fields-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/release/verify_packaged_gui.py --binary-dir "$output/payload" --settings-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/release/verify_packaged_gui.py --binary-dir "$output/payload" --gongwen-fields-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified Windows packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docwen-candidate/DocWen-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  build-linux:
    if: ${{ !inputs.macos_only }}
    name: Build Linux packages
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    needs: [identity, source-checks]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/base:noble@sha256:24ea8d1abd543fb56208fa8f9468c9a684e65aa8c42d54f76e312127f1ed5cd9
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install Linux GUI dependencies
        shell: bash
        run: bash scripts/release/install_linux_build_dependencies.sh
      - name: Install exact lockfile
        run: uv sync --frozen --extra dev
      - name: Build GUI and CLI payloads
        run: xvfb-run -a uv run python scripts/build/build.py --skip-cython --version "$RELEASE_VERSION"
      - name: Create deterministic Linux archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir publication
          uv run python scripts/release/linux_archive.py \
            --contract release/linux-production-manifest.v1.json \
            --artifact cli-only \
            --payload-root "dist/DocWenCLI_v${RELEASE_VERSION}_linux-x64" \
            --output "publication/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz"
          uv run python scripts/release/linux_archive.py \
            --contract release/linux-production-manifest.v1.json \
            --artifact gui-cli \
            --payload-root "dist/DocWen_v${RELEASE_VERSION}_linux-x64" \
            --output "publication/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz"
      - name: Verify extracted Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted-cli extracted-gui
          tar -xzf "publication/DocWenCLI-${RELEASE_VERSION}-linux-x64.tar.gz" -C extracted-cli --no-same-owner
          tar -xzf "publication/DocWen-${RELEASE_VERSION}-linux-x64.tar.gz" -C extracted-gui --no-same-owner
          cli_dir="extracted-cli/DocWenCLI-${RELEASE_VERSION}-linux-x64"
          gui_dir="extracted-gui/DocWen-${RELEASE_VERSION}-linux-x64"
          (cd "$cli_dir" && sha256sum --check SHA256SUMS.txt)
          (cd "$gui_dir" && sha256sum --check SHA256SUMS.txt)
          uv run python scripts/release/verify_packaged_cli.py --binary-dir "$cli_dir" --proofread-report-smoke --gongwen-fields-smoke
          xvfb-run -a uv run python scripts/release/verify_packaged_gui.py --binary-dir "$gui_dir" --settings-smoke
          xvfb-run -a uv run python scripts/release/verify_packaged_gui.py --binary-dir "$gui_dir" --gongwen-fields-smoke
      - name: Upload verified Linux packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  build-macos:
    name: Build macOS packages
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    needs: [identity, source-checks, macos-source-checks]
    if: >-
      always() && !cancelled() && needs.identity.result == 'success' &&
      needs.identity.outputs.build == 'true' &&
      ((inputs.macos_only && needs.macos-source-checks.result == 'success') ||
       (!inputs.macos_only && needs.source-checks.result == 'success'))
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Require native Apple Silicon and install image/Office dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install libheif
          # The rolling stable directory retires old cask URLs. Pin the official
          # archive and its published digest so every retry uses the same host.
          libreoffice_version=26.8.2.2
          dmg="$RUNNER_TEMP/LibreOffice_${libreoffice_version}_MacOS_aarch64.dmg"
          mount="$RUNNER_TEMP/docwen-libreoffice"
          curl --fail --location --retry 3 \
            "https://downloadarchive.documentfoundation.org/libreoffice/old/${libreoffice_version}/mac/aarch64/LibreOffice_${libreoffice_version}_MacOS_aarch64.dmg" \
            --output "$dmg"
          printf '%s  %s\n' \
            9f24fe83ab1ed5c95eb3df580119f32932f713e577feeac02bf619fb00749b55 "$dmg" \
            | shasum -a 256 --check -
          test ! -e /Applications/LibreOffice.app
          mkdir "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          sudo ditto "$mount/LibreOffice.app" /Applications/LibreOffice.app
          hdiutil detach "$mount"
          trap - EXIT
          office_version=$(/Applications/LibreOffice.app/Contents/MacOS/soffice --version)
          printf '%s\n' "$office_version"
          case "$office_version" in
            "LibreOffice ${libreoffice_version} "*) ;;
            *) echo "Unexpected LibreOffice host version" >&2; exit 1 ;;
          esac
      - name: Install exact lockfile
        run: uv sync --frozen --extra dev
      - name: Build GUI and CLI payloads once
        run: uv run python scripts/build/build.py --skip-cython --version "$RELEASE_VERSION"
      - name: Compose ad-hoc signed app and verify both extracted archives
        run: >-
          uv run python scripts/release/macos_package.py
          --output build/macos-publication --report "$RUNNER_TEMP/macos-release-checks.json"
      - name: Upload verified macOS packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/macos-publication/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Save compact macOS package checks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-release-checks.json
          if-no-files-found: warn
          retention-days: 30

  verify-release:
    # The unused Mac-only source job is skipped in an ordinary release. Override
    # inherited skip propagation while still requiring every actual producer.
    if: >-
      always() && !cancelled() && !inputs.macos_only &&
      needs.identity.result == 'success' && needs.identity.outputs.build == 'true' &&
      needs.build-windows.result == 'success' && needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success'
    outputs:
      artifact_id: ${{ steps.publication.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication.outputs.artifact-digest }}
    needs: [identity, build-windows, build-linux, build-macos]
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the verified Windows packages by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact_id }}
          path: builds/windows
          digest-mismatch: error
      - name: Download the verified Linux packages by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact_id }}
          path: builds/linux
          digest-mismatch: error
      - name: Download the verified macOS packages by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact_id }}
          path: builds/macos
          digest-mismatch: error
      - name: Assemble the exact verified candidate
        run: >-
          python scripts/release/publication.py assemble
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --source-ref "$GITHUB_REF"
          --source . --builds builds --directory publication
      - name: Attest exact candidate and public assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: publication/*
      - name: Upload the exact publication candidate
        id: publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PUBLICATION_ARTIFACT_NAME }}
          path: publication/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Record candidate identity
        env:
          ARTIFACT_ID: ${{ steps.publication.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publication.outputs.artifact-digest }}
        run: |
          echo "Candidate artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate artifact digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify mode leaves this candidate unpublished for selected host acceptance. Publish reuses its exact artifact ID." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload small manifest for selected-platform acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-publication-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication/candidate.json
            publication/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  publish:
    needs: [identity, verify-release]
    if: >-
      always() && !cancelled() &&
      needs.identity.result == 'success' && needs.identity.outputs.publish == 'true' &&
      (needs.verify-release.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.artifact_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      actions: read
      contents: write
      attestations: read
    outputs:
      artifact_id: ${{ needs.verify-release.outputs.artifact_id || inputs.artifact_id }}
      artifact_digest: ${{ needs.verify-release.outputs.artifact_digest }}
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
      ARTIFACT_ID: ${{ needs.verify-release.outputs.artifact_id || inputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.verify-release.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve the exact candidate from this run or the explicit recovery ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          digest_args=()
          if [[ -n "$ARTIFACT_DIGEST" ]]; then
            digest_args=(--artifact-digest "$ARTIFACT_DIGEST")
          fi
          python scripts/release/publication.py fetch \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" "${digest_args[@]}" \
            --directory "$RUNNER_TEMP/publication"
      - name: Verify draft assets and publish immutable Release
        run: |
          set -euo pipefail
          resume_args=()
          if [[ -n "$RESUME_ARTIFACT_ID" ]]; then
            resume_args=(--resume-artifact-id "$RESUME_ARTIFACT_ID")
          else
            test "$GITHUB_RUN_ATTEMPT" -eq 1
          fi
          python scripts/release/publication.py publish \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --directory "$RUNNER_TEMP/publication" --receipt "$RUNNER_TEMP/publication-progress.json" \
            --notes docs/CHANGELOG.md "${resume_args[@]}"
      - name: Preserve publication progress, including uncertain writes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-publication-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-progress.json
          if-no-files-found: warn
          retention-days: 30

  post-verify:
    if: >-
      always() && !cancelled() && needs.identity.result == 'success' &&
      (needs.identity.outputs.verify_hosted == 'true' ||
       (needs.publish.result != 'skipped' && needs.publish.outputs.artifact_id != ''))
    needs: [identity, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: ${{ needs.publish.outputs.artifact_id || inputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.publish.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve the same verified candidate
        run: >-
          python scripts/release/publication.py fetch
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --artifact-id "$ARTIFACT_ID"
          --directory "$RUNNER_TEMP/publication"
      - name: Independently verify immutable hosted bytes and provenance
        run: >-
          python scripts/release/publication.py verify
          --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          --artifact-id "$ARTIFACT_ID"
          --directory "$RUNNER_TEMP/publication" --receipt "$RUNNER_TEMP/publication-readback.json"
      - name: Save independent readback receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-publication-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-readback.json
          if-no-files-found: warn
          retention-days: 30
