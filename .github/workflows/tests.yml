name: tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  DOCWEN_GUI_DISABLE_STATE_SAVE: "1"
  QT_QPA_PLATFORM: offscreen
  DOCWEN_PYTEST_XDIST: "1"
  DOCWEN_PYTEST_XDIST_WORKERS: "auto"

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra lint --extra test
      - name: Required source checks
        run: uv run python tools/qa.py --skip-pytest

  tests:
    name: Tests on ${{ matrix.os }}
    needs: source-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suite: full
            coverage: true
          - os: ubuntu-24.04
            suite: platform
            coverage: false
          - os: macos-14
            suite: platform
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
          enable-cache: true
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install macOS image dependencies
        if: runner.os == 'macOS'
        run: brew install libheif
      - name: Install exact lockfile
        run: uv sync --frozen --extra test --extra dev --extra lint
      - name: Run the platform selection once, export compact reports, and clean raw tests
        shell: pwsh
        env:
          QA_SUITE: ${{ matrix.suite }}
          QA_COVERAGE: ${{ matrix.coverage }}
        run: |
          $coverageArgs = @()
          if ($env:QA_COVERAGE -eq 'true') { $coverageArgs = @('--coverage') }
          uv run python tools/qa.py --tests-only --suite "$env:QA_SUITE" @coverageArgs `
            --pytest-runtime-root "$env:RUNNER_TEMP/docwen-qa-runtime" --own-pytest-runtime `
            --report-output "$env:RUNNER_TEMP/docwen-qa-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload compact visibility and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docwen-qa-reports/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required checks
    if: always()
    needs: [source-checks, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject missing, failed, or skipped required checks
        env:
          DOCWEN_CI_RESULTS: ${{ toJSON(needs) }}
        run: python -m tools.source_checks
