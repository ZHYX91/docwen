          }

          locale_dir = Path("i18n/locales")
          for filename, values in translations.items():
              path = locale_dir / filename
              text = path.read_text(encoding="utf-8")
              section = "[components.template_selector]"
              if "manage_templates =" not in text:
                  marker = section + "\n"
                  if marker not in text:
                      raise SystemExit(f"missing {section} in {filename}")
                  text = text.replace(
                      marker,
                      marker + f"manage_templates = {json.dumps(values['manage_templates'], ensure_ascii=False)}\n",
                      1,
                  )
              if "[settings.templates]" not in text:
                  lines = ["", "[settings.templates]"]
                  for key in (
                      "title", "description", "import", "copy_edit", "edit", "rename", "export", "delete",
                      "move_up", "move_down", "open_user_folder", "refresh", "status_note", "custom", "builtin",
                      "builtin_hint", "file_filter", "name_prompt", "delete_confirm",
                  ):
                      lines.append(f"{key} = {json.dumps(values[key], ensure_ascii=False)}")
                  text = text.rstrip() + "\n" + "\n".join(lines) + "\n"
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit synchronized locale catalogues
        run: |
          if ! git diff --quiet -- i18n/locales; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add i18n/locales
            git commit -m "feat: localize template management"
            git push origin HEAD:feat/template-management
          fi
