name: template-format-preview

on:
  pull_request:
    paths:
      - "packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py"
      - "packages/apps/gui/src/docwen_gui/widgets/template_selector.py"
      - ".github/workflows/template-format-preview.yml"

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/template-management
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.0"
      - name: Install lint tools
        run: uv sync --frozen --extra lint
      - name: Apply exact Ruff formatting
        run: |
          uv run ruff format packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py packages/apps/gui/src/docwen_gui/widgets/template_selector.py
          if ! git diff --quiet -- packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py packages/apps/gui/src/docwen_gui/widgets/template_selector.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py packages/apps/gui/src/docwen_gui/widgets/template_selector.py
            git commit -m "style: apply Ruff formatting"
            git push origin HEAD:feat/template-management
          fi
