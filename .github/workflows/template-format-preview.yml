name: template-format-preview

on:
  pull_request:
    paths:
      - "packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py"
      - "packages/apps/gui/src/docwen_gui/widgets/template_selector.py"
      - ".github/workflows/template-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.0"
      - name: Install lint tools
        run: uv sync --frozen --extra lint
      - name: Print exact Ruff formatting diff
        run: |
          uv run ruff format packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py packages/apps/gui/src/docwen_gui/widgets/template_selector.py
          git diff -- packages/apps/gui/src/docwen_gui/widgets/template_management_dialog.py packages/apps/gui/src/docwen_gui/widgets/template_selector.py
