name: chatgpt-fix-output-contract

on:
  push:
    branches:
      - fix/portable-data-and-integration-contracts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/portable-data-and-integration-contracts
          fetch-depth: 0
      - name: Update clean-output contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_cli/test_cli_e2e.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert (output.parent / "docwen-node.json").is_file()'
          new = 'assert not (output.parent / "docwen-node.json").exists()'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 legacy node-manifest assertions, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_cli/test_cli_e2e.py
          git commit -m "test: align CLI output contract with clean results"
          git push origin HEAD:fix/portable-data-and-integration-contracts
