name: fix pyright branch

on:
  push:
    branches:
      - fix/portable-data-and-integration-contracts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/portable-data-and-integration-contracts
      - name: Apply typed follow-up patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found: {path}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'packages/apps/cli/src/docwen_cli/machine/query_service.py',
              '            resource = {\n',
              '            resource: dict[str, Any] = {\n',
          )
          replace(
              'packages/apps/cli/tests/test_resources_capabilities.py',
              '        description="Corporate Report DOCX template",\n        path=',
              '        description="Corporate Report DOCX template",\n        origin="builtin",\n        is_default=False,\n        path=',
          )
          replace(
              'packages/bundle/tests/test_entrypoints_02.py',
              '        server = gui_entry._start_gui_control(window, app=fake_app)\n',
              '        server = gui_entry._start_gui_control(window, app=fake_app, app_name="docwen-test")\n',
          )
          replace(
              'packages/runtime/src/docwen_runtime/templates/registry.py',
              '                if is_managed_user:\n                    template_id = self._state_store.ensure_user_identity(path, target)\n',
              '                if is_managed_user:\n                    assert self._state_store is not None\n                    template_id = self._state_store.ensure_user_identity(path, target)\n',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "fix: satisfy typed template and control contracts"
          git push origin HEAD:fix/portable-data-and-integration-contracts
