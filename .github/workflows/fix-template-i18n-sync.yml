name: fix-template-i18n-sync

on:
  pull_request:
    paths:
      - ".github/workflows/fix-template-i18n-sync.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/template-management
      - name: Remove stray Python heredoc marker
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/workflows/template-i18n-sync.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace("          PY\n      - name: Commit synchronized locale catalogues", "      - name: Commit synchronized locale catalogues", 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/template-i18n-sync.yml
          git commit -m "ci: repair temporary locale sync helper"
          git push origin HEAD:feat/template-management
