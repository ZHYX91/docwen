name: Temporary PR formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/ocr-table-wps-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          python-version: "3.12.13"
      - run: uv sync --frozen --extra lint --extra test
      - run: uv run ruff check --fix "packages/apps/gui/src/docwen_gui/execution_coordinator.py" "packages/apps/gui/src/docwen_gui/execution_presenter.py" "packages/apps/gui/src/docwen_gui/path_identity.py" "packages/apps/gui/src/docwen_gui/view_models/_runtime_route_filter.py" "packages/apps/gui/src/docwen_gui/view_models/activity_records.py" "packages/apps/gui/src/docwen_gui/view_models/info_area_vm.py" "packages/apps/gui/tests/test_runtime_route_filter.py" "packages/core/src/docwen_core/text/_slanet_table.py" "packages/core/src/docwen_core/text/image_markdown.py" "packages/core/src/docwen_core/text/ocr.py" "packages/core/src/docwen_core/text/table_recognition.py" "packages/core/tests/test_ocr_01.py" "packages/core/tests/test_table_recognition.py" "packages/plugins/document/src/docwen_plugin_document/to_markdown/converter.py" "packages/plugins/document/tests/test_request_scoped_docx_policy_02.py" "packages/plugins/image/src/docwen_plugin_image/to_markdown/converter.py" "packages/plugins/image/tests/test_image_conversions_04.py" "packages/plugins/layout/src/docwen_plugin_layout/preprocess.py" "packages/plugins/layout/src/docwen_plugin_layout/to_markdown/converter.py" "packages/plugins/markup/src/docwen_plugin_markup/markdown_resources.py" "packages/plugins/markup/tests/test_markdown_resources.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/models.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/pipeline.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/rendering/markdown_renderer.py" "packages/plugins/optimizers/gongwen/tests/test_gongwen_golden.py" "packages/plugins/presentation/src/docwen_plugin_presentation/pptx_md/converter.py" "packages/plugins/presentation/tests/test_presentation_to_md_03.py" "packages/plugins/spreadsheet/src/docwen_plugin_spreadsheet/to_markdown/converter.py" "packages/plugins/spreadsheet/tests/test_xlsx_to_md_golden_04.py" "scripts/build/build.py" "scripts/release/packaged_resources.py" "tests/test_repo/test_ocr_consumer_best_effort_projection_contract.py" "tests/test_repo/test_resource_packaging_docs.py"
      - run: uv run ruff format "packages/apps/gui/src/docwen_gui/execution_coordinator.py" "packages/apps/gui/src/docwen_gui/execution_presenter.py" "packages/apps/gui/src/docwen_gui/path_identity.py" "packages/apps/gui/src/docwen_gui/view_models/_runtime_route_filter.py" "packages/apps/gui/src/docwen_gui/view_models/activity_records.py" "packages/apps/gui/src/docwen_gui/view_models/info_area_vm.py" "packages/apps/gui/tests/test_runtime_route_filter.py" "packages/core/src/docwen_core/text/_slanet_table.py" "packages/core/src/docwen_core/text/image_markdown.py" "packages/core/src/docwen_core/text/ocr.py" "packages/core/src/docwen_core/text/table_recognition.py" "packages/core/tests/test_ocr_01.py" "packages/core/tests/test_table_recognition.py" "packages/plugins/document/src/docwen_plugin_document/to_markdown/converter.py" "packages/plugins/document/tests/test_request_scoped_docx_policy_02.py" "packages/plugins/image/src/docwen_plugin_image/to_markdown/converter.py" "packages/plugins/image/tests/test_image_conversions_04.py" "packages/plugins/layout/src/docwen_plugin_layout/preprocess.py" "packages/plugins/layout/src/docwen_plugin_layout/to_markdown/converter.py" "packages/plugins/markup/src/docwen_plugin_markup/markdown_resources.py" "packages/plugins/markup/tests/test_markdown_resources.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/models.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/pipeline.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/rendering/markdown_renderer.py" "packages/plugins/optimizers/gongwen/tests/test_gongwen_golden.py" "packages/plugins/presentation/src/docwen_plugin_presentation/pptx_md/converter.py" "packages/plugins/presentation/tests/test_presentation_to_md_03.py" "packages/plugins/spreadsheet/src/docwen_plugin_spreadsheet/to_markdown/converter.py" "packages/plugins/spreadsheet/tests/test_xlsx_to_md_golden_04.py" "scripts/build/build.py" "scripts/release/packaged_resources.py" "tests/test_repo/test_ocr_consumer_best_effort_projection_contract.py" "tests/test_repo/test_resource_packaging_docs.py"
      - run: git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "packages/apps/gui/src/docwen_gui/execution_coordinator.py" "packages/apps/gui/src/docwen_gui/execution_presenter.py" "packages/apps/gui/src/docwen_gui/path_identity.py" "packages/apps/gui/src/docwen_gui/view_models/_runtime_route_filter.py" "packages/apps/gui/src/docwen_gui/view_models/activity_records.py" "packages/apps/gui/src/docwen_gui/view_models/info_area_vm.py" "packages/apps/gui/tests/test_runtime_route_filter.py" "packages/core/src/docwen_core/text/_slanet_table.py" "packages/core/src/docwen_core/text/image_markdown.py" "packages/core/src/docwen_core/text/ocr.py" "packages/core/src/docwen_core/text/table_recognition.py" "packages/core/tests/test_ocr_01.py" "packages/core/tests/test_table_recognition.py" "packages/plugins/document/src/docwen_plugin_document/to_markdown/converter.py" "packages/plugins/document/tests/test_request_scoped_docx_policy_02.py" "packages/plugins/image/src/docwen_plugin_image/to_markdown/converter.py" "packages/plugins/image/tests/test_image_conversions_04.py" "packages/plugins/layout/src/docwen_plugin_layout/preprocess.py" "packages/plugins/layout/src/docwen_plugin_layout/to_markdown/converter.py" "packages/plugins/markup/src/docwen_plugin_markup/markdown_resources.py" "packages/plugins/markup/tests/test_markdown_resources.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/models.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/pipeline.py" "packages/plugins/optimizers/gongwen/src/docwen_plugin_optimizer_gongwen/rendering/markdown_renderer.py" "packages/plugins/optimizers/gongwen/tests/test_gongwen_golden.py" "packages/plugins/presentation/src/docwen_plugin_presentation/pptx_md/converter.py" "packages/plugins/presentation/tests/test_presentation_to_md_03.py" "packages/plugins/spreadsheet/src/docwen_plugin_spreadsheet/to_markdown/converter.py" "packages/plugins/spreadsheet/tests/test_xlsx_to_md_golden_04.py" "scripts/build/build.py" "scripts/release/packaged_resources.py" "tests/test_repo/test_ocr_consumer_best_effort_projection_contract.py" "tests/test_repo/test_resource_packaging_docs.py"
          git commit -m "style: format OCR table PR changes"
          git push origin HEAD:${{ github.head_ref }}
