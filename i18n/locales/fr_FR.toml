format_help_text = """Utilisation des espaces réservés de format

占位符格式：{级别.样式}

可用样式：
  chinese_lower  - 小写中文数字 (一、二、三)
  chinese_upper  - 大写中文数字 (壹、贰、叁)
  arabic_half    - 半角阿拉伯数字 (1, 2, 3)
  arabic_full    - 全角阿拉伯数字 (１、２、３)
  arabic_circled - 带圈数字 (①②③)
  letter_upper   - 大写字母 (A, B, C)
  letter_lower   - 小写字母 (a, b, c)
  roman_upper    - 大写罗马数字 (I, II, III)
  roman_lower    - 小写罗马数字 (i, ii, iii)

示例：
  {1.chinese_lower}、 → 一、二、三、
  （{2.chinese_lower}） → （一）（二）（三）
  {3.arabic_half}. → 1. 2. 3.
  {1.arabic_half}.{2.arabic_half} → 1.1、1.2"""

