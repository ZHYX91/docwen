ascii_font = "Arial"
font_size_pt = 14
first_line_indent_chars = 0
first_line_indent_cm = 0
spacing_after_twip = 120
spacing_before_twip = 240
bold = true
justification = "left"

# 标题3-9格式（仿宋_GB2312、三号、2字符）
[style_formats.heading_3_9]
east_asia_font = "SimSun"
ascii_font = "Arial"
font_size_pt = 12
first_line_indent_chars = 0
first_line_indent_cm = 0
spacing_after_twip = 120
spacing_before_twip = 240
bold = true
justification = "left"

# =============================================================================
# 占位符（用于文档模板）
# 这些占位符用于 MD → DOCX 转换时的模板填充
# =============================================================================
[placeholders]
title = "título"
body = "cuerpo"

# =============================================================================
# YAML 键名（用于元数据）
# 这些键名用于 DOCX → MD 转换时的 YAML 前置信息输出
# =============================================================================
[yaml_keys]
title = "título"
subtitle = "subtítulo"
